[package]
name = "paper2_tracing"
version = "0.1.0"
edition = "2024"
description = "Paper2 subscriber for tracing, a Rust logging framework. This is a subscriber for tracing that uses paper2's logging system to log messages from tracing. Useful for Rust mods that use tracing for logging, as it allows them to log messages to paper2's logging system."


[dependencies]
# paper2 = { path = "..", features = ["ffi"], default-features = false }
paper2_ffi = { path = "../paper2_ffi", default-features = false }
# tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

tracing = { version = "0.1", features = [
    "std",
], default-features = false }

[lib]
name = "paper2_tracing"
crate-type = ["lib"]
