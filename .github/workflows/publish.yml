name: Publish QPM Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish_qpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Read manually selected version
        if: github.event_name == 'workflow_dispatch'
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v4.8.0"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: Fernthedev/qpm-action@v2
        with:
          publish: late
          publish_token: ${{ secrets.QPM_TOKEN }}
          tag: ${{ inputs.tag }}
          version: ${{ steps.release.outputs.version }}

      - name: Set up Rust for Android
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup target add aarch64-linux-android
          cargo +stable install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$(<ndkpath.txt)" >> "$GITHUB_ENV"
