name: NDK build

on:
  push:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run Rust tests
        run: cargo test --locked

      - uses: Fernthedev/qpm-action@v2

      - name: Run C++ test
        working-directory: cpp
        run: |
          ./test.sh
          LD_LIBRARY_PATH="../target/debug:${LD_LIBRARY_PATH:-}" timeout 300 ./test

  build_android:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: Fernthedev/qpm-action@v2

      - name: Set up Rust for Android
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup target add aarch64-linux-android
          cargo +stable install cargo-ndk --version 3.5.4 --locked
          echo "ANDROID_NDK_HOME=$(<ndkpath.txt)" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          qpm2 qpkg --qmod
          unzip -tq paper2_scotland2.qpkg
          unzip -tq paper2_scotland2.qmod

      - uses: actions/upload-artifact@v4
        with:
          name: paper2-scotland2-packages
          path: |
            paper2_scotland2.qpkg
            paper2_scotland2.qmod
          if-no-files-found: error
