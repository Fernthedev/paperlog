[package]
name = "paper2"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["paper2_ffi", "paper2_log", "questloader", "scotland2", "paper2_tracing"]
resolver = "3"

[lib]
name = "paper2"
crate-type = ["cdylib", "staticlib", "lib"]

[[bench]]
name = "logger_bench"
harness = false

[[bench]]
name = "lock_compare"
harness = false

[[bench]]
name = "chunking_bench"
harness = false

[[bench]]
name = "ffi_bench"
harness = false

[dependencies]

tracing = { version = "0.1", features = [
    "std",
], default-features = false, optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], default-features = false, optional = true }
tracing-error = { version = "0.2", default-features = false, optional = true }
paranoid-android = { version = "0.2", optional = true }
chrono = "0.4"
thiserror = "2.0"
rustc-hash = "2.1.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
smallvec = { version = "1.15", features = ["union", "const_generics"] }
bstr = "1.13.0"

[dev-dependencies]
# `no-env-filter`: by default `traced_test` only captures events from the
# test binary's own crate, which would drop every event emitted from
# `paper2::logger::sinks::tracing_logger`.
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
color-eyre = "0.6"
criterion = "0.8"


[build-dependencies]
cbindgen = { version = "0.29", default-features = false }


[features]
default = [
    "global_log",
    "context_log",
    "ffi",
    "backtrace",
    "file",
    "sinks"
]
android-api-30 = []
global_log = []
context_log = []
ffi = []
backtrace = []

sinks = []
file = []
logcat = []
stdout = []

tracing = [
    "dep:tracing",
    "dep:tracing-error",
    "dep:tracing-subscriber",
    "dep:paranoid-android",
]

# android specific features
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"


[profile.release]
opt-level = 3
lto = true
debug = "full"
# strip = "symbols"
